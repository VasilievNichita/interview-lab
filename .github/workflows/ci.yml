name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:local
      - name: Test local API
        shell: bash
        run: |
          pnpm exec wrangler dev --ip 127.0.0.1 --port 8787 > /tmp/interview-lab-worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill "$WORKER_PID" || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/api/health; then break; fi
            sleep 1
          done
          TEST_BASE_URL=http://127.0.0.1:8787 pnpm test
